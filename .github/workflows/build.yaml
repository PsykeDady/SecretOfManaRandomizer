name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-windows:
    name: Windows (WinForms, net462)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: nuget restore SoMRandomizer.sln
      - name: Build Debug
        run: msbuild SoMRandomizer.sln /p:Configuration=Debug /verbosity:minimal
      - name: Store
        uses: actions/upload-artifact@v4
        with:
          name: SecretOfManaRandomizer-Windows-Debug
          path: SoMRandomizer/bin/Debug/net462/SoMRandomizer.*
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

  build-linux:
    name: Linux (Avalonia, net8.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/SoMRandomizer.sln
      - name: Build Release
        run: dotnet build src/SoMRandomizer.sln -c Release --no-restore
      - name: Package self-contained linux-x64
        run: |
          chmod +x scripts/package-linux.sh
          PACKAGE_VERSION="${GITHUB_REF_NAME//\//-}" scripts/package-linux.sh
          PKG="dist/SoMRandomizer-${GITHUB_REF_NAME//\//-}-linux-x64"
          test -x "$PKG/app/SoMRandomizer"
          test -x "$PKG/cli/SoMRandomizer.Cli"
          set +e
          "$PKG/cli/SoMRandomizer.Cli"
          code=$?
          set -e
          test "$code" -eq 1
      - name: Test installer
        run: |
          chmod +x install.sh
          export SOM_HOME="$RUNNER_TEMP/som-home"
          export NUGET_PACKAGES="$HOME/.nuget/packages"
          export HOME="$SOM_HOME"
          export XDG_CACHE_HOME="$SOM_HOME/.cache"
          export XDG_BIN_HOME="$SOM_HOME/.local/bin"
          export XDG_DATA_HOME="$SOM_HOME/.local/share"
          export XDG_STATE_HOME="$SOM_HOME/.local/state"
          mkdir -p "$SOM_HOME"
          ./install.sh --local
          test -x "$SOM_HOME/.local/bin/somrandomizer"
          test -x "$SOM_HOME/.local/bin/somrandomizer-cli"
          test -f "$XDG_DATA_HOME/applications/somrandomizer.desktop"
          test -f "$XDG_STATE_HOME/somrandomizer/install-manifest.txt"
          set +e
          "$SOM_HOME/.local/bin/somrandomizer-cli"
          code=$?
          set -e
          test "$code" -eq 1
          ./install.sh --local --no-build
          ./install.sh --local --uninstall
          test ! -e "$SOM_HOME/.local/lib/somrandomizer"
          test ! -e "$XDG_STATE_HOME/somrandomizer/install-manifest.txt"
      - name: Store
        uses: actions/upload-artifact@v4
        with:
          name: SecretOfManaRandomizer-Linux-x64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
